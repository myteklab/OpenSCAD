<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenSCAD 3D Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

#viewer-container {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 40px;
}

#controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 40px;
  background: #16213e;
  border-top: 1px solid #0f3460;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 0 16px;
  font-size: 13px;
}

#controls label {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  user-select: none;
}

#controls .icon {
  display: inline-flex;
  align-items: center;
  opacity: 0.7;
}

#controls label:hover .icon,
#controls button:hover .icon {
  opacity: 1;
}

#controls input[type="color"] {
  width: 22px;
  height: 22px;
  border: 1px solid #0f3460;
  border-radius: 4px;
  padding: 0;
  cursor: pointer;
  background: none;
}

#controls input[type="checkbox"] {
  display: none;
}

#controls .toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s;
}

#controls .toggle:hover {
  background: rgba(255,255,255,0.06);
}

#controls input[type="checkbox"]:checked + .toggle {
  background: rgba(15,52,96,0.8);
  border-color: #1a4080;
}

#controls input[type="checkbox"]:checked + .toggle .icon {
  opacity: 1;
}

#controls button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #0f3460;
  color: #e0e0e0;
  border: 1px solid #1a4080;
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
  font-size: 12px;
}

#controls button:hover {
  background: #1a4080;
}

#loading-msg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 16px;
  color: #8899aa;
}

#error-msg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 14px;
  color: #ff6b6b;
  text-align: center;
  display: none;
  max-width: 80%;
}

.hint {
  color: #667788;
  font-size: 11px;
}

#scale-label {
  position: absolute;
  bottom: 8px;
  left: 10px;
  background: rgba(22,33,62,0.85);
  color: #8899aa;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 3px;
  pointer-events: none;
  z-index: 10;
  display: none;
}

/* Customize drawer */
#customize-btn {
  display: none;
  background: #e94560;
  border-color: #e94560;
  color: #fff;
}

#customize-btn:hover {
  background: #d13350;
}

#customize-btn.active {
  background: #d13350;
}

#customize-drawer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 40px;
  width: min(290px, 85%);
  background: rgba(16, 27, 54, 0.97);
  border-left: 1px solid #0f3460;
  z-index: 20;
  display: none;
  flex-direction: column;
  box-shadow: -4px 0 16px rgba(0, 0, 0, 0.5);
}

#customize-drawer.show {
  display: flex;
}

.cz-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
  border-bottom: 1px solid #0f3460;
  flex-shrink: 0;
}

.cz-title {
  font-size: 12px;
  font-weight: 600;
  color: #0cebeb;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.cz-header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

#cz-reset {
  background: none;
  border: 1px solid #1a4080;
  color: #8899bb;
  border-radius: 4px;
  font-size: 11px;
  padding: 3px 8px;
  cursor: pointer;
}

#cz-reset:hover {
  color: #e0e0e0;
  border-color: #e94560;
}

#cz-close {
  background: none;
  border: none;
  color: #8899bb;
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
  padding: 2px 5px;
}

#cz-close:hover {
  color: #e94560;
}

#cz-content {
  overflow-y: auto;
  padding: 10px 12px 12px;
  flex-grow: 1;
}

.cz-section {
  color: #e94560;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 12px 0 8px 0;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(233, 69, 96, 0.3);
}

.cz-section:first-child {
  margin-top: 0;
}

.cz-param {
  margin-bottom: 11px;
}

.cz-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 3px;
}

.cz-name {
  font-size: 12px;
  font-weight: 500;
  color: #e0e0e0;
  font-family: 'Courier New', monospace;
}

.cz-value {
  font-size: 11px;
  color: #20e3b2;
  font-family: 'Courier New', monospace;
}

.cz-desc {
  font-size: 10px;
  color: #8899bb;
  margin-bottom: 3px;
}

.cz-param input[type="range"] {
  width: 100%;
  accent-color: #e94560;
  cursor: pointer;
}

.cz-param input[type="number"],
.cz-param input[type="text"],
.cz-param select {
  width: 100%;
  background: #0d1b2a;
  border: 1px solid #0f3460;
  border-radius: 4px;
  color: #e0e0e0;
  font-size: 12px;
  padding: 4px 7px;
  font-family: 'Courier New', monospace;
}

.cz-param input:focus,
.cz-param select:focus {
  outline: none;
  border-color: #e94560;
}

.cz-check {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
}

.cz-check input {
  accent-color: #e94560;
  width: 14px;
  height: 14px;
  cursor: pointer;
  display: inline-block;
}

#cz-status {
  flex-shrink: 0;
  padding: 6px 12px;
  font-size: 11px;
  color: #8899bb;
  border-top: 1px solid #0f3460;
  min-height: 27px;
}

#cz-status.working {
  color: #0cebeb;
}

#cz-status.error {
  color: #ff6b6b;
}
</style>
</head>
<body>

<div id="viewer-container">
  <div id="scale-label"></div>
</div>

<div id="customize-drawer">
  <div class="cz-header">
    <span class="cz-title">Customize</span>
    <div class="cz-header-actions">
      <button id="cz-reset" title="Back to the original model">Reset</button>
      <button id="cz-close" title="Close">&times;</button>
    </div>
  </div>
  <div id="cz-content"></div>
  <div id="cz-status"></div>
</div>

<div id="controls">
  <label title="Model color">
    <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2v-.5c0-.5-.2-1-.5-1.3-.3-.3-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4c3 0 5.6-2.5 5.6-5.5C23 5.4 18 2 12 2z"/><circle cx="8" cy="10" r="1.5" fill="currentColor"/><circle cx="12" cy="7" r="1.5" fill="currentColor"/><circle cx="16" cy="10" r="1.5" fill="currentColor"/></svg></span>
    <input type="color" id="color-picker" value="#5cff59">
  </label>
  <label title="Toggle grid">
    <input type="checkbox" id="grid-toggle" checked>
    <span class="toggle">
      <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg></span>
      Grid
    </span>
  </label>
  <label title="Auto-rotate">
    <input type="checkbox" id="rotate-toggle">
    <span class="toggle">
      <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/><polyline points="21 3 21 9 15 9"/></svg></span>
      Rotate
    </span>
  </label>
  <label title="Show edges">
    <input type="checkbox" id="edges-toggle">
    <span class="toggle">
      <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5v8l-9 5-9-5V8z"/><line x1="12" y1="3" x2="12" y2="13"/><line x1="12" y1="13" x2="21" y2="8"/><line x1="12" y1="13" x2="3" y2="8"/></svg></span>
      Edges
    </span>
  </label>
  <button id="customize-btn" title="Change this model's parameters">
    <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2" fill="currentColor"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="7" cy="17" r="2" fill="currentColor"/></svg></span>
    Customize
  </button>
  <button id="reset-cam" title="Reset camera to default position">
    <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></span>
    Reset View
  </button>
  <span class="hint">Drag to rotate, scroll to zoom, right-drag to pan</span>
</div>

<div id="loading-msg">Loading 3D model...</div>
<div id="error-msg">Could not load the 3D model.<br>The model may not have been rendered before sharing.</div>

<script src="deps/three.min.js"></script>
<script src="deps/webgl_detector.js"></script>
<script src="deps/OrbitControls.js"></script>
<script src="deps/stl_viewer.min.js"></script>
<script>
(function() {
  'use strict';

  var viewer = null;
  var loadingEl = document.getElementById('loading-msg');
  var errorEl = document.getElementById('error-msg');
  var scaleLabel = document.getElementById('scale-label');
  var colorPicker = document.getElementById('color-picker');
  var gridToggle = document.getElementById('grid-toggle');
  var rotateToggle = document.getElementById('rotate-toggle');
  var edgesToggle = document.getElementById('edges-toggle');
  var resetCam = document.getElementById('reset-cam');
  var stlUrl = null;
  var cachedGridSpacing = 1;

  // Default camera state (isometric-like view)
  var defaultCameraState = {
    position: { x: 0, y: 20, z: 50 },
    up: { x: 0, y: 1, z: 0 },
    target: { x: 0, y: 0, z: 0 }
  };

  function getGridParams() {
    var dims = viewer.get_model_info(1).dims;
    var gridSize = parseInt(dims.x) * 2;
    var gridY = parseInt(dims.y) * 2;
    if (gridY > gridSize) gridSize = gridY;
    if (gridSize < 50) gridSize = 50;
    var divisions = gridSize;
    if (gridSize >= 1000) divisions = gridSize / 100;
    else if (gridSize >= 100) divisions = gridSize / 10;
    var spacing = gridSize / divisions;
    return { size: gridSize, divisions: divisions, spacing: spacing };
  }

  function updateScaleLabel(spacing, show) {
    if (!show) { scaleLabel.style.display = 'none'; return; }
    var unit = spacing;
    var text = unit + ' unit' + (unit !== 1 ? 's' : '') + ' per square';
    scaleLabel.textContent = text;
    scaleLabel.style.display = 'block';
  }

  function showError() {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
  }

  function buildViewer(stlSource) {
    var container = document.getElementById('viewer-container');
    viewer = new StlViewer(container);

    viewer.model_loaded_callback = function(id) {
      loadingEl.style.display = 'none';

      // Apply initial settings
      viewer.set_color(id, colorPicker.value);
      viewer.set_center_models(true);
      viewer.set_auto_zoom(true);
      viewer.set_auto_resize(true);

      // Z-up to Y-up rotation (OpenSCAD convention)
      viewer.rotate(id, -1.5708, 0, 0);

      // Grid setup: scale divisions so there are never too many lines
      var gp = getGridParams();
      cachedGridSpacing = gp.spacing;

      if (gridToggle.checked) {
        viewer.set_grid(true, gp.size, gp.divisions);
        addAxesHelper(gp.size);
        updateScaleLabel(gp.spacing, true);
      }

      // Notify parent that preview has loaded
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'PREVIEW_LOADED' }, '*');
      }
    };

    // Load the model
    if (typeof stlSource === 'string' && stlSource.indexOf('/') !== -1) {
      // URL - fetch and load
      viewer.add_model({ id: 1, filename: stlSource });
    } else if (stlSource instanceof Blob || stlSource instanceof File) {
      viewer.add_model({ id: 1, local_file: stlSource });
    }
  }

  function addAxesHelper(size) {
    if (!viewer || !viewer.scene) return;
    // Remove existing
    var existing = viewer.scene.getObjectByName('PreviewAxes');
    if (existing) viewer.scene.remove(existing);

    var axesHelper = new THREE.AxesHelper((size / 2) + 1);
    axesHelper.name = 'PreviewAxes';
    var colors = axesHelper.geometry.attributes.color;
    colors.setXYZ(0, 1, 0, 0);
    colors.setXYZ(1, 1, 0, 0);
    colors.setXYZ(2, 0, 0, 1);
    colors.setXYZ(3, 0, 0, 1);
    colors.setXYZ(4, 0, 1, 0);
    colors.setXYZ(5, 0, 1, 0);
    viewer.scene.add(axesHelper);
  }

  function removeAxesHelper() {
    if (!viewer || !viewer.scene) return;
    var existing = viewer.scene.getObjectByName('PreviewAxes');
    if (existing) viewer.scene.remove(existing);
  }

  // Wire up controls
  colorPicker.addEventListener('input', function() {
    if (viewer) viewer.set_color(1, colorPicker.value);
  });

  gridToggle.addEventListener('change', function() {
    if (!viewer) return;
    try {
      var gp = getGridParams();

      if (gridToggle.checked) {
        viewer.set_grid(true, gp.size, gp.divisions);
        addAxesHelper(gp.size);
        updateScaleLabel(gp.spacing, true);
      } else {
        viewer.set_grid(false, gp.size, gp.divisions);
        updateScaleLabel(gp.spacing, false);
        removeAxesHelper();
      }
    } catch (e) { /* model not loaded yet */ }
  });

  rotateToggle.addEventListener('change', function() {
    if (viewer) viewer.set_auto_rotate(rotateToggle.checked);
  });

  edgesToggle.addEventListener('change', function() {
    if (viewer) viewer.set_edges(1, edgesToggle.checked);
  });

  resetCam.addEventListener('click', function() {
    if (viewer) {
      viewer.set_auto_zoom(true);
      viewer.set_center_models(true);
    }
  });

  // ==========================================================================
  // Customizer: rebuild the model from its source with new parameter values.
  // The compiler (13MB wasm) is only fetched after the first value change;
  // opening the drawer costs nothing but a text parse.
  // ==========================================================================
  var projectCode = null;
  var projectFeatures = [];
  var czParams = [];
  var czValues = {};
  var czMod = null;          // customizer.js module (parser + formatValue)
  var runnerMod = null;      // openscad-runner.js module
  var czGeneration = 0;      // stale-render guard
  var czKill = null;         // kill handle for the in-flight render
  var czDebounce = null;
  var RENDER_TIMEOUT_MS = 60000;

  var customizeBtn = document.getElementById('customize-btn');
  var drawer = document.getElementById('customize-drawer');
  var czContent = document.getElementById('cz-content');
  var czStatus = document.getElementById('cz-status');

  function setStatus(text, cls) {
    czStatus.textContent = text || '';
    czStatus.className = cls || '';
  }

  function stepDecimalsOf(step) {
    if (!step || Number.isInteger(step)) return 0;
    var s = String(step);
    var dot = s.indexOf('.');
    return dot === -1 ? 0 : s.length - dot - 1;
  }

  function buildDrawerControls() {
    czContent.innerHTML = '';
    var lastSection;
    czParams.forEach(function(param) {
      if (param.section !== lastSection) {
        lastSection = param.section;
        if (param.section) {
          var heading = document.createElement('div');
          heading.className = 'cz-section';
          heading.textContent = param.section;
          czContent.appendChild(heading);
        }
      }
      czContent.appendChild(buildDrawerControl(param));
    });
  }

  function buildDrawerControl(param) {
    var wrap = document.createElement('div');
    wrap.className = 'cz-param';

    if (param.type === 'boolean') {
      var checkLabel = document.createElement('label');
      checkLabel.className = 'cz-check';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = czValues[param.name];
      cb.onchange = function() { setValue(param.name, cb.checked); };
      var cbName = document.createElement('span');
      cbName.className = 'cz-name';
      cbName.textContent = param.name;
      checkLabel.appendChild(cb);
      checkLabel.appendChild(cbName);
      wrap.appendChild(checkLabel);
      if (param.description) wrap.appendChild(descEl(param.description));
      return wrap;
    }

    var labelRow = document.createElement('div');
    labelRow.className = 'cz-label';
    var nameSpan = document.createElement('span');
    nameSpan.className = 'cz-name';
    nameSpan.textContent = param.name;
    labelRow.appendChild(nameSpan);
    wrap.appendChild(labelRow);
    if (param.description) wrap.appendChild(descEl(param.description));

    if (param.options) {
      var select = document.createElement('select');
      param.options.forEach(function(opt) {
        var o = document.createElement('option');
        o.value = String(opt.value);
        o.textContent = opt.label;
        if (opt.value === czValues[param.name]) o.selected = true;
        select.appendChild(o);
      });
      select.onchange = function() {
        setValue(param.name, param.type === 'number' ? parseFloat(select.value) : select.value);
      };
      wrap.appendChild(select);
      return wrap;
    }

    if (param.type === 'number' && param.min !== undefined && param.max !== undefined) {
      var step = param.step !== undefined ? param.step
        : (Number.isInteger(param.value) && Number.isInteger(param.min) && Number.isInteger(param.max) ? 1 : 0.1);
      var decimals = stepDecimalsOf(step);
      var valueSpan = document.createElement('span');
      valueSpan.className = 'cz-value';
      valueSpan.textContent = Number(czValues[param.name]).toFixed(decimals);
      labelRow.appendChild(valueSpan);
      var slider = document.createElement('input');
      slider.type = 'range';
      slider.min = param.min;
      slider.max = param.max;
      slider.step = step;
      slider.value = czValues[param.name];
      slider.oninput = function() {
        valueSpan.textContent = Number(slider.value).toFixed(decimals);
      };
      slider.onchange = function() {
        setValue(param.name, parseFloat(slider.value));
      };
      wrap.appendChild(slider);
      return wrap;
    }

    if (param.type === 'number') {
      var num = document.createElement('input');
      num.type = 'number';
      num.step = 'any';
      num.value = czValues[param.name];
      num.onchange = function() {
        var v = parseFloat(num.value);
        if (!isNaN(v)) setValue(param.name, v);
      };
      wrap.appendChild(num);
      return wrap;
    }

    var text = document.createElement('input');
    text.type = 'text';
    text.value = czValues[param.name];
    text.onchange = function() { setValue(param.name, text.value); };
    wrap.appendChild(text);
    return wrap;
  }

  function descEl(description) {
    var el = document.createElement('div');
    el.className = 'cz-desc';
    el.textContent = description;
    return el;
  }

  function setValue(name, value) {
    czValues[name] = value;
    clearTimeout(czDebounce);
    czDebounce = setTimeout(renderCustomized, 400);
  }

  function overrideArgs() {
    var args = [];
    czParams.forEach(function(param) {
      var v = czValues[param.name];
      if (v !== param.value) {
        args.push('-D', param.name + '=' + czMod.formatValue(param.type, v));
      }
    });
    return args;
  }

  function renderCustomized() {
    var overrides = overrideArgs();
    if (overrides.length === 0) {
      restoreOriginal();
      return;
    }
    var generation = ++czGeneration;
    if (czKill) { try { czKill(); } catch (e) {} czKill = null; }
    setStatus('Rebuilding the model...', 'working');

    var load = runnerMod ? Promise.resolve(runnerMod) : import('./openscad-runner.js');
    load.then(function(mod) {
      runnerMod = mod;
      if (generation !== czGeneration) return;

      var job = mod.spawnOpenSCAD({
        inputs: [['input.scad', projectCode + '\n']],
        args: ['input.scad', '-o', 'export.stl', '--export-format=binstl']
          .concat(projectFeatures.map(function(f) { return '--enable=' + f; }))
          .concat(overrides),
        outputPaths: ['export.stl']
      });
      czKill = job.kill;

      var timer = setTimeout(function() {
        if (generation === czGeneration && czKill) {
          try { czKill(); } catch (e) {}
          czKill = null;
          setStatus('That took too long to build. Try a smaller change.', 'error');
        }
      }, RENDER_TIMEOUT_MS);

      job.then(function(result) {
        clearTimeout(timer);
        if (generation !== czGeneration) return;
        czKill = null;
        var output = result.outputs && result.outputs[0];
        if (result.exitCode !== 0 || !output) {
          setStatus('Could not build the model with those values.', 'error');
          return;
        }
        var blob = new Blob([output[1]], { type: 'application/octet-stream' });
        swapModel(new File([blob], 'customized.stl'));
        setStatus('Showing your customized model.', '');
      }).catch(function() {
        clearTimeout(timer);
        if (generation !== czGeneration) return;
        czKill = null;
        setStatus('Could not build the model with those values.', 'error');
      });
    }).catch(function() {
      if (generation === czGeneration) setStatus('Customizer could not load.', 'error');
    });
  }

  function swapModel(source) {
    if (!viewer) return;
    try { viewer.remove_model(1); } catch (e) {}
    if (typeof source === 'string') {
      viewer.add_model({ id: 1, filename: source });
    } else {
      viewer.add_model({ id: 1, local_file: source });
    }
  }

  function restoreOriginal() {
    czGeneration++;
    if (czKill) { try { czKill(); } catch (e) {} czKill = null; }
    if (stlUrl) swapModel(stlUrl);
    setStatus('', '');
  }

  function initCustomizer(code) {
    import('./customizer.js').then(function(mod) {
      czMod = mod;
      var parsed = mod.parseParameters(code);
      czParams = parsed.parameters;
      if (czParams.length === 0) return;
      czParams.forEach(function(param) { czValues[param.name] = param.value; });
      buildDrawerControls();
      customizeBtn.style.display = 'inline-flex';
    }).catch(function() { /* old browser or fetch failure: no customizer */ });
  }

  customizeBtn.addEventListener('click', function() {
    var open = !drawer.classList.contains('show');
    drawer.classList.toggle('show', open);
    customizeBtn.classList.toggle('active', open);
  });

  document.getElementById('cz-close').addEventListener('click', function() {
    drawer.classList.remove('show');
    customizeBtn.classList.remove('active');
  });

  document.getElementById('cz-reset').addEventListener('click', function() {
    clearTimeout(czDebounce);
    czParams.forEach(function(param) { czValues[param.name] = param.value; });
    buildDrawerControls();
    restoreOriginal();
  });

  // Listen for messages from the parent page
  window.addEventListener('message', function(e) {
    var msg = e.data || {};

    if (msg.type === 'LOAD_PREVIEW') {
      // Received from project-preview.php
      // msg.stlUrl = URL to fetch the STL file
      // msg.data = project data (code, features), used by the customizer
      if (msg.stlUrl) {
        stlUrl = msg.stlUrl;
        buildViewer(stlUrl);
        if (msg.data && typeof msg.data.code === 'string' && msg.data.code) {
          projectCode = msg.data.code;
          projectFeatures = Array.isArray(msg.data.features) ? msg.data.features : [];
          initCustomizer(projectCode);
        }
      } else {
        showError();
      }
    }
  });

  // Signal ready to parent
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'PREVIEW_READY' }, '*');
  }
})();
</script>
</body>
</html>
